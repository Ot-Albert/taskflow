<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow — a simple, responsive personal task manager. Create, edit, filter, sort and export your tasks."
    />
    <meta name="theme-color" content="#f8f3e7" />
    <!-- Pre-paint theme script: reads taskflow.theme.v2 (matches STORAGE_KEYS.THEME in src/utils/constants.js) -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("taskflow.theme.v2"));
          var theme = stored === "dark" || stored === "light" ? stored : null;
          if (!theme) {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#080806" : "#f8f3e7");
          }
        } catch (e) {
          var fallback =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", fallback);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TaskFlow — Personal Task Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
